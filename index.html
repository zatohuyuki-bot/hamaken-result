<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>社員試験 合否発表</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Noto Sans JP", sans-serif;
        background: linear-gradient(135deg, #eef7ff, #ffffff);
        color: #222;
    }

    .box {
        width: 90%;
        max-width: 600px;
        padding: 55px 30px;
        text-align: center;
        background: white;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 30px;
    }

    .pass {
        font-size: 70px;
        font-weight: 900;
        color: #1677ff;
        margin: 20px 0;
        animation: pop 1s ease;
    }

    .message {
        font-size: 18px;
        line-height: 1.8;
        margin-top: 25px;
    }

    .footer {
        margin-top: 35px;
        font-size: 14px;
        color: #777;
    }

    @keyframes pop {
        0% {
            transform: scale(0.3);
            opacity: 0;
        }
        70% {
            transform: scale(1.1);
        }
        100% {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>
</head>

<body>

<div class="box">

    <div class="title">
        羽間県 社員試験 合否発表
    </div>

    <div class="pass">
        🎉 合格！！ 🎉
    </div>

    <div class="message">
        運営試験の結果、<br>
        <strong>あなたは社員試験に合格しました。</strong>
        <br><br>
        今後とも羽間県をよろしくお願いします。
    </div>

    <div class="footer">
        羽間県運営
    </div>

</div>

</body>
</html>
